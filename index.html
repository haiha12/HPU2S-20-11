*{box-sizing:border-box}
body{font-family:'Be Vietnam Pro',sans-serif;color:#5b4a6b;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#FFE4EF,#FFB6C1 28%,#E0F4FF 62%,#A1C4FD) fixed}
h1,h2,h3,.btn,.fq{font-family:Quicksand,sans-serif}.fm{font-family:Mali,cursive}
.g{background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.85);box-shadow:0 8px 30px rgba(161,196,253,.4);border-radius:28px}
.btn,.mb button{display:inline-block;padding:9px 18px;border:0;border-radius:99px;background:linear-gradient(135deg,#ff9ec4,#8fb4fa);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(255,150,190,.4);transition:.2s;font-family:Quicksand,sans-serif}
.btn:hover,.mb button:hover{transform:translateY(-2px) scale(1.03)}
.fi{animation:fi .5s ease}@keyframes fi{from{opacity:0;transform:translateY(14px)}}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg svg{position:absolute;fill:currentColor}
.fl{top:-30px;animation:fall linear infinite}@keyframes fall{to{transform:translate(40px,115vh) rotate(260deg)}}
.cl{left:0;animation:drift linear infinite}@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}

.hr{position:absolute;bottom:-60px;fill:currentColor;animation:up linear forwards}@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:.2}}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;text-align:center;transition:.25s}
.card:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 14px 34px rgba(255,150,190,.45)}

.pol{background:#fff;padding:12px 12px 8px;box-shadow:0 10px 25px rgba(120,120,180,.28);position:relative;width:min(300px,80vw);transform:rotate(-2deg);transition:.3s}
.pol.sm{width:min(210px,70vw);transform:rotate(3deg)}.pol:hover{transform:rotate(0) scale(1.03)}

.pol figcaption{padding:10px 4px 4px;text-align:center;color:#d6548c;font-size:.95rem}
.tape{position:absolute;top:-12px;left:50%;width:92px;height:26px;margin-left:-46px;transform:rotate(-4deg);background:repeating-linear-gradient(45deg,rgba(255,182,193,.85) 0 8px,rgba(255,255,255,.65) 8px 16px)}
.b .tape{background:repeating-linear-gradient(45deg,rgba(161,196,253,.9) 0 8px,rgba(255,255,255,.65) 8px 16px)}
.qt{font-family:Mali,cursive;text-align:center;font-size:1.15rem;color:#d6548c;background:linear-gradient(135deg,#fff0f6,#eaf6ff);border:2px dashed #ffb6c1;border-radius:22px;padding:20px 24px;max-width:640px;margin:auto}
.lt{max-width:640px;margin:auto;background-color:#fffdf7;background-image:repeating-linear-gradient(transparent 0 31px,rgba(161,196,253,.6) 31px 32px);border-left:3px solid #ffb6c1;border-radius:14px;padding:0 20px 0 24px;line-height:32px;font-family:Mali,cursive;white-space:pre-wrap;box-shadow:0 8px 22px rgba(255,150,190,.25)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(90,70,130,.35);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px}
.lb{z-index:70;cursor:zoom-out}.lb img,.lb svg{width:min(90vw,520px);height:min(90vw,520px);object-fit:contain;background:#fff;padding:12px;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.mb{max-height:90vh;overflow:auto;width:min(640px,100%);padding:20px}
.mb label{display:block;font-size:.8rem;font-weight:500}.mb label.btn{display:inline-block;font-size:.85rem}
.mb input:not([type=file]):not([type=range]),.mb select,.mb textarea{width:100%;padding:8px 12px;border-radius:14px;border:1.5px solid #ffc9dc;background:#fff;margin:3px 0 8px;font:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.7);border-radius:14px;padding:6px 10px;margin:6px 0;font-size:.9rem}
.li button{padding:4px 12px;margin-left:4px}
.ps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;text-align:center}
.pv{aspect-ratio:1;background:#ffeef5;border-radius:12px;overflow:hidden;margin-bottom:4px}.pv img{width:100%;height:100%;object-fit:cover}
.vy{width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;box-shadow:0 6px 18px rgba(80,60,120,.4);background:radial-gradient(circle,#ffb6c1 0 15%,#fff 16% 18%,transparent 19%),conic-gradient(rgba(255,255,255,.22),transparent 30%,rgba(255,255,255,.22) 50%,transparent 80%),repeating-radial-gradient(#1c1c24 0 2px,#2c2c38 2px 4px)}
.spin{animation:sp 3.5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:80;background:#fff;color:#d6548c;padding:10px 18px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:.9rem}
@media(prefers-reduced-motion:reduce){#bg *,.fi{animation:none!important}}

for(let i=0;i<3;i++)h+=`<svg class="cl" style="top:${8+i*28}%;width:${120+i*40}px;height:${60+i*20}px;animation-duration:${70+i*30}s;animation-delay:-${i*25}s;color:rgba(255,255,255,.8)"><use href="#c"/></svg>`;
$('#bg').innerHTML=h+'<svg class="pn" style="color:#8fb4fa"><use href="#p"/></svg>'})();
/* định tuyến */
function route(){const m=location.hash.match(/^#\/thay-co\/(.+)$/);scrollTo(0,0);A.classList.remove('fi');void A.offsetWidth;A.classList.add('fi');m?page(decodeURIComponent(m[1])):home()}
addEventListener('hashchange',route);
const card=x=>`<a href="#/thay-co/${e(x.id)}" class="g card"><div class="av">${x.p[0]?`<img src="${e(x.p[0])}" alt="">`:chibi(x)}</div><b class="fq">${e(x.n)}</b><small>${e(x.r)}</small></a>`;
function home(){A.innerHTML=`<section class="g p-6 sm:p-10 text-center mb-8"><h1 class="text-2xl sm:text-4xl font-bold" style="color:#d6548c">Ngày Nhà giáo Việt Nam 20/11 🌷</h1><p class="fm mt-3 max-w-xl mx-auto">Gửi đến các thầy cô của HPU2S những lời tri ân chân thành nhất. Kính mời thầy cô chọn tên để mở trang yêu thương dành riêng cho thầy cô ạ!</p><input id="q" placeholder="🔍 Tìm tên thầy cô..." class="mt-5 w-full max-w-sm px-4 py-3 rounded-full border-2 border-pink-200 bg-white/80 outline-none focus:border-pink-300"></section><div id="ls"></div>`;
const f=()=>{const k=nz($('#q').value.trim());$('#ls').innerHTML=G.map((g,i)=>{const a=S.t.filter(x=>x.g==g&&nz(x.n+' '+x.r).includes(k));return a.length?`<h2 class="text-xl font-bold mt-6 mb-3" style="color:#7a2f6b">${GI[i]} ${g}</h2><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">${a.map(card).join('')}</div>`:''}).join('')||'<p class="text-center">Không tìm thấy thầy cô nào. Thử gõ tên khác nhé!</p>'};$('#q').oninput=f;f()}
function page(id){const x=S.t.find(t=>t.id==id);if(!x){location.hash='#/';return}
const fr=(i,c,cap)=>`<figure class="pol ${c}"><i class="tape"></i><div class="ph" onclick="lb(this)">${x.p[i]?`<img src="${e(x.p[i])}" alt="">`:chibi(x)}</div><figcaption class="fm">${cap}</figcaption></figure>`;
A.innerHTML=`<a href="#/" class="btn">← Danh sách thầy cô</a><div class="g p-5 sm:p-8 mt-4 space-y-8"><div class="text-center"><h1 class="text-2xl sm:text-4xl font-bold" style="color:#d6548c">${e(x.n)}</h1><p class="mt-1">${e(x.r||x.g)}</p></div><div class="flex flex-wrap justify-center items-start gap-8 pt-3">${fr(0,'',e(x.c||'Mãi biết ơn thầy cô 💕'))}${[1,2].filter(i=>x.p[i]).map(i=>fr(i,'sm b','💖🎀')).join('')}</div><blockquote class="qt">“${e(x.q||DQ)}”</blockquote><div class="lt"><b class="fq">💕🌸Kính gửi ${e(x.n)} thân yêu 🌷💞</b>\n${e(x.w||wish(x.n))}\n\n— ĐỘI XUNG KÍCH HPU2S —</div><div class="text-center"><button id="hb" class="btn" style="font-size:1.1rem;padding:12px 26px">Gửi Ngàn Trái Tim 💖</button></div></div>`;$('#hb').onclick=love}
function lb(el){const d=document.createElement('div');d.className='ov lb';d.innerHTML=el.innerHTML;d.onclick=()=>d.remove();document.body.append(d)}
addEventListener('keydown',ev=>{if(ev.key=='Escape')document.querySelectorAll('.lb').forEach(x=>x.remove())});
function love(){let h='';for(let i=0;i<40;i++){const s=18+Math.random()*26;h+=`<svg class="hr" style="left:${Math.random()*100}vw;width:${s}px;height:${s}px;color:${['#ffb6c1','#ff9ec4','#a1c4fd','#ffd1e3'][i%4]};animation-delay:${Math.random()*1.2}s;animation-duration:${2.5+Math.random()*2}s"><use href="#h"/></svg>`}
const d=document.createElement('div');d.className='fixed inset-0 pointer-events-none z-50 overflow-hidden';d.innerHTML=h;document.body.append(d);setTimeout(()=>d.remove(),5400);
if(window.confetti){const o={colors:['#ffb6c1','#a1c4fd','#ffe4ef','#e0f4ff','#ffffff'],ticks:220,gravity:.7,scalar:.9};confetti({...o,particleCount:70,spread:80,origin:{y:.75}});setTimeout(()=>confetti({...o,particleCount:45,angle:60,spread:60,origin:{x:0,y:.8}}),300);setTimeout(()=>confetti({...o,particleCount:45,angle:120,spread:60,origin:{x:1,y:.8}}),500)}}
/* nhạc nền: hộp nhạc tự tạo, hoặc file mp3 do admin tải lên */
let ac,mg,tm,au,on=0,vol=.5,st=0,ni=0;const F=[659,784,880,784,659,587,523,587,659,784,1047,880,784,659,587,523],Bs=[262,220,175,196];
const idb=(m,v)=>new Promise(r=>{const q=indexedDB.open('hp',1);q.onupgradeneeded=()=>q.result.createObjectStore('a');q.onsuccess=()=>{const s=q.result.transaction('a',m=='get'?'readonly':'readwrite').objectStore('a'),x=m=='get'?s.get('m'):s.put(v,'m');x.onsuccess=()=>r(x.result);x.onerror=()=>r()};q.onerror=()=>r()});
const setAu=src=>{const w=on;if(w)mu(0);au=new Audio(src);au.loop=true;au.volume=vol;if(w)mu(1)};
try{idb('get').then(f=>{if(f)setAu(URL.createObjectURL(f));else fetch('music.mp3',{method:'HEAD'}).then(r=>{if(r.ok&&/audio|octet/.test(r.headers.get('content-type')||''))setAu('music.mp3')}).catch(()=>{})}).catch(()=>{})}catch(_){}
function note(f,t,d,g){const o=ac.createOscillator(),n=ac.createGain();o.frequency.value=f;n.gain.setValueAtTime(0,t);n.gain.linearRampToValueAtTime(g,t+.01);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n);n.connect(mg);o.start(t);o.stop(t+d)}
function tick(){const t=ac.currentTime+.05,f=F[ni%16];note(f,t,1.6,.18);note(f*2,t,.7,.04);if(ni%4==0)note(Bs[(ni/4|0)%4],t,2.2,.12);ni++}
function ui(){$('#vy').classList.toggle('spin',!!on);$('#mb').textContent=on?'⏸ Tắt':'▶ Bật'}
function mu(o){on=o===undefined?!on:o;
if(au){on?au.play().catch(()=>{on=0;ui()}):au.pause()}
else if(on){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(!mg){mg=ac.createGain();mg.connect(ac.destination)}mg.gain.value=vol;ac.resume();clearInterval(tm);tm=setInterval(tick,520)}
else clearInterval(tm);ui()}
function tg(){st=1;mu()}
$('#vr').oninput=ev=>{vol=ev.target.value/100;if(mg)mg.gain.value=vol;if(au)au.volume=vol};
addEventListener('pointerdown',ev=>{if(!st&&!ev.target.closest('#mp')){st=1;mu(1)}});
/* quản trị */
let adm=0,ed;
const modal=h=>{$('#md').innerHTML=`<div class="ov"><div class="g mb">${h}</div></div>`},xm=()=>{$('#md').innerHTML=''};
function login(){if(adm)return dash();modal(`<h3 class="text-xl font-bold mb-3">👑 Quản trị viên</h3><label>Tài khoản<input id="u" autocomplete="username"></label><label>Mật khẩu<input id="pw" type="password" onkeydown="if(event.key=='Enter')doLogin()"></label><p id="er" class="text-sm" style="color:#d6548c"></p><div class="row"><button onclick="doLogin()">Đăng nhập</button><button onclick="xm()">Hủy</button></div>`)}
function doLogin(){if($('#u').value.trim()=='admin'&&$('#pw').value==S.pw){adm=1;dash()}else $('#er').textContent='Sai tài khoản hoặc mật khẩu 🥺'}
function dash(){modal(`<div class="row" style="justify-content:space-between"><h3 class="text-xl font-bold">👑 Bảng quản trị</h3><span><button onclick="adm=0;xm()">Đăng xuất</button> <button onclick="xm()">Đóng</button></span></div>
<div class="row"><input id="npw" placeholder="Mật khẩu mới" style="width:auto;flex:1;padding:8px 12px;border-radius:14px;border:1.5px solid #ffc9dc"><button onclick="chpw()">Đổi mật khẩu</button></div>
<div class="row"><button onclick="exp()">⬇ Xuất JSON</button><label class="btn">⬆ Nhập JSON<input type="file" accept=".json,application/json" hidden onchange="imp(this)"></label><label class="btn">🎵 Tải nhạc nền<input type="file" accept="audio/*" hidden onchange="mus(this)"></label></div>
<p class="text-xs">💡 Muốn mọi người cùng thấy: Xuất JSON → đặt file <b>data.json</b> (và nhạc <b>music.mp3</b>) cạnh <b>index.html</b> trên web.</p><div class="row"><button onclick="edit()">＋ Thêm thầy/cô</button></div>
${S.t.map(x=>`<div class="li"><span>${e(x.n)} <small>(${e(x.g)})</small></span><span><button onclick="edit('${x.id}')">Sửa</button><button onclick="del('${x.id}',this)">Xóa</button></span></div>`).join('')}`)}
function chpw(){const p=$('#npw').value;if(p.length<4)return toast('Mật khẩu tối thiểu 4 ký tự');S.pw=p;sv();$('#npw').value='';toast('Đã đổi mật khẩu ✔')}
function del(id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Chắc chắn?';return}S.t=S.t.filter(t=>t.id!=id);sv();dash();route()}
function edit(id){ed=id?JSON.parse(JSON.stringify(S.t.find(t=>t.id==id))):{id:'t'+Date.now(),n:'',g:G[2],r:'',q:'',w:'',c:'',p:[]};
modal(`<h3 class="text-xl font-bold mb-3">${id?'Sửa':'Thêm'} thầy/cô</h3><label>Họ tên (kèm Thầy/Cô)<input id="fn" value="${e(ed.n)}"></label><label>Nhóm công tác<select id="fg">${G.map(g=>`<option ${g==ed.g?'selected':''}>${g}</option>`).join('')}</select></label><label>Chức vụ<input id="fr" value="${e(ed.r)}"></label><label>Câu nói nổi bật<input id="fq" value="${e(ed.q)}"></label><label>Lời chúc 20/11<textarea id="fw" rows="5">${e(ed.w)}</textarea></label><label>Chú thích ảnh chính<input id="fc" value="${e(ed.c)}"></label>
<div class="ps">${[0,1,2].map(i=>`<div><div id="pv${i}" class="pv">${ed.p[i]?`<img src="${e(ed.p[i])}" alt="">`:''}</div><small>${i?'Ảnh phụ '+i:'Ảnh chính'}</small><div class="row" style="justify-content:center"><label class="btn">Chọn<input type="file" accept="image/*" hidden onchange="ph(${i},this)"></label><button onclick="rm(${i})">✕</button></div></div>`).join('')}</div>
<div class="row"><button onclick="sav()">💾 Lưu</button><button onclick="dash()">Quay lại</button></div>`)}
const cmp=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};i.src=u});
async function ph(i,inp){const f=inp.files[0];if(!f)return;ed.p[i]=await cmp(f);$('#pv'+i).innerHTML=`<img src="${ed.p[i]}" alt="">`}
function rm(i){ed.p[i]='';$('#pv'+i).innerHTML=''}
function sav(){const n=$('#fn').value.trim();if(!n)return toast('Hãy nhập họ tên');Object.assign(ed,{n,g:$('#fg').value,r:$('#fr').value.trim(),q:$('#fq').value.trim(),w:$('#fw').value.trim(),c:$('#fc').value.trim()});const k=S.t.findIndex(t=>t.id==ed.id);k<0?S.t.push(ed):S.t[k]=ed;sv();route();dash();toast('Đã lưu ✔')}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({t:S.t})],{type:'application/json'}));a.download='data.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(s=>{try{const d=JSON.parse(s);if(!Array.isArray(d.t))throw 0;S.t=clean(d.t);sv();route();dash();toast('Đã nhập dữ liệu ✔')}catch(_){toast('File JSON không hợp lệ')}})}
function mus(i){const f=i.files[0];if(!f)return;idb('put',f);setAu(URL.createObjectURL(f));if(!on)mu(1);toast('Đã đặt nhạc nền mới ✔')}
const clean=a=>a.map(x=>({id:String(x.id||'t'+Math.random()).replace(/[^\w-]/g,''),n:String(x.n||''),g:G.includes(x.g)?x.g:G[2],r:String(x.r||''),q:String(x.q||''),w:String(x.w||''),c:String(x.c||''),p:(Array.isArray(x.p)?x.p:[]).slice(0,3).map(u=>/^data:image\//.test(u)?u:'')}));
route();
if(!LOC)fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(adm||!Array.isArray(d.t)||!d.t.length)return;S.t=clean(d.t);route()}).catch(()=>{});
</script>
</body></html>
